<!-- [AI 생성 초안 - 검토 전] 농부마을 통장·매출 보기 (7회차 돈의 장부 ③) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통장·매출 보기</title>
<style>
  :root{ --navy:#2B3A4E; --copper:#C67B3C; --cream:#F7F3EE; --teal:#3A8FB7; --ink:#243140; --muted:#6b7785; --line:#e3dccf; --green:#3f7a52; --red:#b3503a; --amber:#b7791f; --forest:#1f3b2d; --gold:#f3c48f; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:"맑은 고딕","Malgun Gothic",sans-serif; background:var(--cream); color:var(--ink); padding:24px; line-height:1.6; max-width:1000px; margin:0 auto; }
  .flow{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:16px; }
  .flow .step{ border:1px solid var(--line); background:#fff; border-radius:10px; padding:6px 12px; font-size:13px; color:var(--muted); line-height:1.35; text-decoration:none; }
  .flow .step small{ display:block; font-size:11px; font-weight:800; color:var(--copper); }
  .flow .step.on{ background:var(--forest); color:#fff; border-color:var(--forest); font-weight:800; }
  .flow .step.on small{ color:var(--gold); }
  .flow .step.later{ opacity:.55; }
  .flow .arr{ color:var(--muted); font-size:13px; }
  .crumb{ font-size:12.5px; color:var(--muted); }
  h1{ font-size:26px; color:var(--navy); margin:2px 0 4px; }
  .sub{ font-size:13.5px; color:var(--muted); margin-bottom:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .sub select{ width:auto; padding:4px 8px; font-size:13.5px; }
  .warn{ background:#fbeee9; border-left:4px solid var(--red); padding:11px 15px; font-size:12.8px; color:#8a3a2a; margin-bottom:16px; border-radius:6px; }
  .warn.live{ background:#eef7f0; border-left-color:var(--green); color:#2f5e3e; }
  .bar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 16px; margin-bottom:14px; }
  .bar .who{ font-size:13px; color:var(--muted); flex:1; min-width:180px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px; }
  .card h3{ font-size:14.5px; color:var(--navy); margin-bottom:12px; }
  .auth{ max-width:420px; margin:0 auto 16px; }
  label{ display:block; font-size:12px; color:var(--muted); font-weight:700; margin:8px 0 4px; }
  input, select{ width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:13.5px; font-family:inherit; background:#fdfbf8; }
  .btn{ border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-copper{ background:var(--copper); color:#fff; } .btn-line{ background:#fff; color:var(--muted); border:1px solid var(--line); }
  .btn-block{ width:100%; margin-top:12px; }
  .help{ font-size:11.5px; color:var(--muted); }
  .msg{ font-size:12.5px; margin-top:8px; padding:8px 10px; border-radius:8px; display:none; }
  .msg.err{ background:#fbeee9; color:var(--red); display:block; }

  /* 남았나 모자랐나 */
  .hero{ background:var(--navy); color:#fff; border-radius:16px; padding:22px 26px; margin-bottom:18px; }
  .hero .t{ font-size:14px; color:#c9d3de; margin-bottom:10px; }
  .hero .r{ display:flex; justify-content:space-between; gap:10px; font-size:16px; padding:5px 0; font-variant-numeric:tabular-nums; }
  .hero .r small{ color:#9fb0c2; font-size:13px; margin-left:6px; }
  .hero .tot{ border-top:1px solid rgba(255,255,255,.25); margin-top:8px; padding-top:12px; font-size:24px; font-weight:800; }
  .hero .exp{ border-top:1px solid rgba(255,255,255,.18); margin-top:14px; padding-top:12px; font-size:13.5px; color:#dfe6ee; line-height:1.8; }
  .hero .exp b{ color:var(--gold); }

  h2{ font-size:17px; color:var(--navy); margin:4px 0 10px; }
  .tbl-wrap{ overflow-x:auto; border-radius:12px; border:1px solid var(--line); background:#fff; margin-bottom:10px; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:520px; }
  th{ background:var(--forest); color:#fff; font-weight:800; text-align:left; padding:10px 14px; white-space:nowrap; }
  td{ padding:10px 14px; border-bottom:1px solid #eee; vertical-align:middle; font-variant-numeric:tabular-nums; }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; white-space:nowrap; }
  td small{ color:var(--muted); font-size:12px; margin-left:4px; }
  tr.uncls td{ background:#fff8e1; }
  tr.sum td{ background:#eef4f8; font-weight:800; }
  .barc{ width:120px; } .barc div{ height:8px; border-radius:5px; background:var(--teal); }
  tr.uncls .barc div{ background:var(--amber); }
  .note{ background:#fff8ea; border:1px solid #f0d9a8; border-radius:12px; padding:12px 16px; font-size:13px; color:#5a4a2a; margin-bottom:18px; }
  .note.plain{ background:#fff; border-color:var(--line); color:var(--ink); }
  .note a{ color:var(--copper); font-weight:700; }
  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:26px 10px; background:#fff; border:1px dashed var(--line); border-radius:12px; margin-bottom:16px; }
  footer{ text-align:center; color:var(--muted); font-size:12px; margin-top:20px; line-height:1.7; }
  a.back{ color:var(--copper); font-weight:700; text-decoration:none; }
  @media (max-width: 700px){ body{ padding:16px; } .hero{ padding:18px; } .hero .tot{ font-size:20px; } }
</style>
</head>
<body>

<div class="flow">
  <a class="step" href="erp-money-collect.html"><small>모은다</small>📥 자료 수집현황</a><span class="arr">→</span>
  <a class="step" href="erp-money-sort.html"><small>붙인다</small>🗂️ 거래 분류함</a><span class="arr">→</span>
  <span class="step on"><small>본다</small>🏦 통장·매출 보기</span><span class="arr">·</span>
  <a class="step" href="erp-money-pnl.html"><small>본다</small>📊 월 손익</a><span class="arr">·</span>
  <span class="step later"><small>본다</small>⏳ 미수금</span>
</div>

<div class="crumb">경영·자금 › 통장·매출 보기 🔒</div>
<h1>통장·매출 보기</h1>
<div class="sub"><select id="month"></select><span id="subLine"></span></div>

<div class="warn" id="modeNote"></div>
<div class="bar" id="bar" style="display:none"></div>
<div id="auth"></div>

<div id="app" style="display:none">
  <div id="body"></div>
</div>

<footer>
  erp-money-view.html · 정본 1장 · 7회차 돈의 장부 · 거래 분류함과 같은 자료(농부마을 창고)로 셈 (실습판: 주소 끝 ?practice=1) · <a class="back" href="erp-map.html">← 지도로 돌아가기</a><br>
  관리회계(이번 달 보고 판단하려는 숫자)용 — 세무·회계 처리의 최종 판단은 세무사에게 확인 · [AI 생성 초안 - 검토 전]
</footer>

<script src="erp-config.js"></script>
<script src="erp-money-common.js"></script>
<script>
const M = window.MoneyCommon, $ = id => document.getElementById(id), esc = M.esc, won = M.won;

function render(){
  const months = M.months();
  const keep = $("month").value;
  $("month").innerHTML = months.map(m => `<option value="${m}">${M.monthLabel(m)}</option>`).join("") || `<option value="">거래 없음</option>`;
  if(months.includes(keep)) $("month").value = keep;
  const month = $("month").value;
  if(!month){
    $("subLine").textContent = "";
    $("body").innerHTML = `<div class="empty">아직 통장 거래가 없어요.<br><a href="erp-money-sort.html">🗂️ 거래 분류함</a>에서 통장 거래를 붙이고 내 분류를 정하면 여기에 모여요.</div>`;
    return;
  }
  const s = M.stats(month);
  $("subLine").textContent = "· 통장 거래 " + s.count + "건 · 내가 정한 분류로 묶음";

  // ① 남았나 모자랐나 (통장 보기 규칙: 미분류도 「쓴 것」에 넣어 셈)
  const diff = s.bankChange - s.viewResult;
  const salesNames = Object.values(s.salesBy).sort((a, b) => b.amount - a.amount).slice(0, 3).map(g => g.name).join("·");
  let exp = `통장은 <b>${won(Math.abs(s.bankChange))}원 ${s.bankChange < 0 ? "줄었습니다" : "늘었습니다"}</b>.`;
  if(Math.abs(diff) >= 1){
    const why = [];
    if(s.nonOut) why.push(s.nonOutList.map(t => t.cat).filter((v, i, a) => a.indexOf(v) === i).join("·") + " " + M.man(s.nonOut) + "은 <b>나갔지만 돌려받을 돈·갚은 빚</b>");
    if(s.nonIn) why.push(s.nonInList.map(t => t.cat).filter((v, i, a) => a.indexOf(v) === i).join("·") + " " + M.man(s.nonIn) + "은 <b>들어왔지만 지난달 판 것 등 손익이 아닌 돈</b>");
    exp += ` 손익과 <b>${M.man(diff)}원</b>이 다릅니다${why.length ? " — " + why.join(", ") + "이기 때문입니다" : ""}.`;
  }
  exp += `<br><b>통장 잔고와 손익은 다릅니다.</b> 통장만 보면 「${s.bankChange < 0 ? "큰일 났다" : "많이 벌었다"}」가 되고, 손익으로 보면 「${M.man(s.viewResult)}원 ${s.viewResult < 0 ? "모자랐다" : "남았다"}」입니다.`;

  let html = `<div class="hero">
    <div class="t">${M.monthLabel(month)} — 남았나 모자랐나</div>
    <div class="r"><span>① 판 것 <small>${esc(salesNames || "계란 매출")}</small></span><span>${won(s.sales)}</span></div>
    <div class="r"><span>② 쓴 것 <small>「안 나간 돈」 뺀 나머지 (미분류 포함)</small></span><span>${won(s.viewSpent)}</span></div>
    <div class="r tot"><span>이번 달</span><span>${M.signed(s.viewResult)}</span></div>
    <div class="exp">${exp}</div>
  </div>`;

  // ② 나간 돈 — 내 분류별
  const costRows = Object.values(s.byCat).filter(b => b.kind === "쓴 것").sort((a, b) => b.amount - a.amount);
  const maxAmt = Math.max(1, ...costRows.map(b => b.amount), s.unclsOut);
  html += `<h2>나간 돈</h2><div class="tbl-wrap"><table>
    <thead><tr><th>분류</th><th class="num">건수</th><th class="num">금액</th><th></th></tr></thead><tbody>
    ${costRows.map(b => `<tr><td><b>${esc(b.cat.name)}</b>${b.refund ? `<small>되돌아온 ${won(b.refund)} 뺌</small>` : ""}</td><td class="num">${b.count}</td><td class="num">${won(b.amount)}</td><td class="barc"><div style="width:${Math.max(2, b.amount / maxAmt * 100)}%"></div></td></tr>`).join("")}
    ${s.uncls.length ? `<tr class="uncls"><td><b>미분류</b><small>아직 안 정함</small></td><td class="num">${s.uncls.length}</td><td class="num">${won(s.unclsNet)}</td><td class="barc"><div style="width:${Math.max(2, s.unclsNet / maxAmt * 100)}%"></div></td></tr>` : ""}
    </tbody></table></div>
    <div class="help" style="margin-bottom:18px">한 줄씩 보려면 <a href="erp-money-sort.html" style="color:var(--copper);font-weight:700">🗂️ 거래 분류함 ↗</a></div>`;

  // ③ 나간 것처럼 보이지만 나간 게 아닌 돈 / 들어왔지만 손익이 아닌 돈
  if(s.nonOutList.length || s.nonInList.length){
    html += `<h2>손익이 아닌 돈</h2><div class="tbl-wrap"><table>
      <thead><tr><th>무엇</th><th>들어옴·나감</th><th class="num">금액</th></tr></thead><tbody>
      ${s.nonOutList.map(t => `<tr><td><b>${esc(t.desc)}</b><small>${esc(t.cat)}</small></td><td>나감</td><td class="num">${won(t.outAmt)}</td></tr>`).join("")}
      ${s.nonInList.map(t => `<tr><td><b>${esc(t.desc)}</b><small>${esc(t.cat)}</small></td><td>들어옴</td><td class="num">${won(t.inAmt)}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="note">★ 이 ${M.man(s.nonOut + s.nonIn)}원을 「비용」이나 「매출」로 세면 이번 달이 실제보다 나쁘거나 좋아 보입니다. 보증금은 돌려받을 돈, 대출 원금은 갚은 빚, 카드정산은 지난달 판 것이 들어온 것입니다.${s.nonOutList.concat(s.nonInList).some(t => t.clobe) ? " 클로브가 자동으로 붙인 분류(" + [...new Set(s.nonOutList.concat(s.nonInList).map(t => t.clobe).filter(Boolean))].map(esc).join("·") + ")와 다르게 정했습니다." : ""}</div>`;
  }

  // ④ 들어온 돈 — 거래처별
  const salesRows = Object.values(s.salesBy).sort((a, b) => b.amount - a.amount);
  html += `<h2>들어온 돈 (판 것)</h2>`;
  html += salesRows.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>거래처(적요)</th><th class="num">건수</th><th class="num">금액</th></tr></thead><tbody>
      ${salesRows.map(g => `<tr><td><b>${esc(g.name)}</b></td><td class="num">${g.count}</td><td class="num">${won(g.amount)}</td></tr>`).join("")}
      <tr class="sum"><td>합계</td><td class="num">${s.salesCount}</td><td class="num">${won(s.sales)}</td></tr>
      </tbody></table></div>` : `<div class="empty">이 달에는 「계란 매출」로 정한 거래가 없어요.</div>`;
  html += `<div class="note plain">⏳ <b>아직 못 받은 돈</b>은 발행한 세금계산서와 들어온 돈을 나란히 놓고 눈으로 맞춰 봐야 합니다. 이름이 다르게 찍히는 일이 많아(「(주)○○」 ↔ 「○○」) <b>자동으로 짝지어 주지 않습니다</b>. 다음 단계 「미수금」 화면에서 합니다.</div>`;

  // ⑤ 미분류
  if(s.uncls.length){
    const pct = s.outSum ? Math.round(s.unclsOut / s.outSum * 100) : 0;
    html += `<div class="note"><b>미분류 ${s.uncls.length}건 (${won(s.unclsNet)}원 · 나간 돈의 ${pct}%)</b> — ${s.uncls.map(t => esc(t.desc) + " " + won(t.outAmt || t.inAmt)).join(" · ")}.<br>
      지우지 않고 그대로 둡니다. 이게 얼마나 되는지 보이는 게 먼저입니다. 정하려면 <a href="erp-money-sort.html">🗂️ 거래 분류함 ↗</a> · 미분류를 따로 두고 센 손익은 <a href="erp-money-pnl.html">📊 월 손익 ↗</a></div>`;
  }
  $("body").innerHTML = html;
}

$("month").addEventListener("change", render);
M.onReady = render;
M.start();
</script>
<script src="erp-home.js"></script>
</body>
</html>
