<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전자결재 연습 ①</title>

  <!-- ▼ CSS = 옷: 어떻게 보이나 -->
  <style>
    body   { font-family: "맑은 고딕"; background: #F7F3EE; padding: 30px; }
    .doc   { background: white; border: 1px solid #e3dccf; border-radius: 12px; padding: 16px; max-width: 420px; }
    .doc h2 { color: #2B3A4E; font-size: 18px; margin: 0 0 8px; }
    .status { color: red; font-weight: bold; }
  </style>
</head>

<!-- ▼ HTML = 뼈대: 무엇이 있나 -->
<body>
  <h1>📝 전자결재</h1>

  <div class="doc">
    <h2>연차 신청</h2>
    <p>기안자: 박민수</p>
    <p>날짜: 2026-10-20</p>
    <p class="status">대표 대기</p>
  </div>
</body>
</html>
